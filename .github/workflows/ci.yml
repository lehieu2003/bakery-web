name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    # Branch/commit/PR-title rules (CONTRIBUTING.md) — PRs only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR source branch allowed for target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "master" ]; then
            case "$HEAD" in
              release/*|hotfix/*|dev) ;;
              *) echo "::error::PR vào master chỉ từ release/*, hotfix/* (hoặc dev). Nhận: $HEAD"; exit 1 ;;
            esac
          fi

      - name: Branch name
        env:
          HEAD: ${{ github.head_ref }}
        run: bash scripts/git-conventions.sh branch "$HEAD"

      - name: PR title (squash commit message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/git-conventions.sh title "$TITLE"

      - name: Commit messages
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout -q "$HEAD_SHA"
          bash scripts/git-conventions.sh commits "origin/$BASE"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Node test suite
        run: pnpm run test:node

      - name: Component test suite
        # Excludes the 2 known-failing baseline specs (pre-existing on master,
        # tracked separately — see vitest CLI excludes in package.json).
        run: pnpm run test:vitest:ci
